baseURL: "https://junde.online/"
title: Junde @ Quant x AI x Astronomy
pagination.pagerSize: 5
theme: "PaperMod"
hasCJKLanguage: true

enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: 东方欲晓 莫道君行早
  description: "blog"
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: light # auto dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "img/logo.png"
    favicon16x16: "img/logo.png"
    favicon32x32: "img/logo.png"
    apple_touch_icon: "img/logo.png"
    safari_pinned_tab: "img/logo.png"

  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "东方欲晓 莫道君行早"
    Content: "✦✧･ﾟ★☾☽✯☄︎☁︎☆★✰⋆⁺₊⋆☄︎✯★･✧✦✧*☾∿⊰⊙⭑✯✧°∿⊹⋆☾⭒⊙⊰∿~*✧"

  socialIcons:
    - name: github
      url: "https://github.com/jundec"
    - name: linkedin
      url: "https://www.linkedin.com/in/jundechen"
    - name: lastfm
      url: "https://www.last.fm/user/foyoko"
    - name: steam
      url: "https://steamcommunity.com/profiles/76561198263933130/"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/jundec/jundec.github.io/blob/master/content/"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: cv
      name: cv
      url: /cv
      weight: 10
    - identifier: library
      name: library
      url: /library
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: archives 
      name: archives
      url: /archives/
      weight: 30
    - identifier: search
      name: search
      url: search
      weight: 40
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma


outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

pygmentsUseClasses: true

markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 2

  goldmark:
      renderer:
        unsafe: true
